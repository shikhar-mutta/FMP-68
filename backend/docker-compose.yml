# ─────────────────────────────────────────────────────────────────────
# FMP-68 — Local Dev Stack
# 6 NestJS microservices + RabbitMQ + Redis + ELK
# MongoDB is NOT containerized — runs on the host (rs0 replica set)
# Services reach the host via host.docker.internal:host-gateway
#
# Secrets (JWT_SECRET, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET) are
# required — populate them by copying backend/.env.example → backend/.env
# (auto-loaded by compose from this directory). The same values live in
# backend/k8s/vault/vault.yaml for the k8s deploy path. Compose will
# refuse to start if any required var is unset, instead of silently
# injecting a placeholder.
# ─────────────────────────────────────────────────────────────────────

services:
  # ─── API GATEWAY ──────────────────────────────────────────────
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    image: fmp-api-gateway:local
    container_name: fmp-api-gateway
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      SERVICE_NAME: api-gateway
      PORT: 4000
      FRONTEND_URL: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required — set it in backend/.env (copy from .env.example) or via Vault}
      AUTH_SERVICE_URL: http://auth-service:4001
      USERS_SERVICE_URL: http://users-service:4002
      PATHS_SERVICE_URL: http://paths-service:4003
      TRACKING_SERVICE_URL: http://tracking-service:4004
      NOTIFICATION_SERVICE_URL: http://notification-service:4005
    depends_on:
      auth-service:
        condition: service_healthy
      users-service:
        condition: service_healthy
      paths-service:
        condition: service_healthy
      tracking-service:
        condition: service_healthy
    networks:
      - fmp-net

  # ─── AUTH SERVICE ─────────────────────────────────────────────
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    image: fmp-auth-service:local
    container_name: fmp-auth-service
    restart: unless-stopped
    ports:
      - "4001:4001"
    environment:
      SERVICE_NAME: auth-service
      PORT: 4001
      FRONTEND_URL: http://localhost:3000
      USERS_SERVICE_URL: http://users-service:4002
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required — set it in backend/.env (copy from .env.example) or via Vault}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is required — set it in backend/.env (copy from .env.example) or via Vault}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:4000/auth/google/callback}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required — set it in backend/.env (copy from .env.example) or via Vault}
      JWT_EXPIRES_IN: 7d
    depends_on:
      users-service:
        condition: service_healthy
    networks:
      - fmp-net

  # ─── USERS SERVICE ────────────────────────────────────────────
  users-service:
    build:
      context: ./users-service
      dockerfile: Dockerfile
    image: fmp-users-service:local
    container_name: fmp-users-service
    restart: unless-stopped
    ports:
      - "4002:4002"
    environment:
      SERVICE_NAME: users-service
      PORT: 4002
      DATABASE_URL: ${DATABASE_URL:-mongodb://host.docker.internal:27017/fmp68?replicaSet=rs0&directConnection=true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - fmp-net

  # ─── PATHS SERVICE ────────────────────────────────────────────
  paths-service:
    build:
      context: ./paths-service
      dockerfile: Dockerfile
    image: fmp-paths-service:local
    container_name: fmp-paths-service
    restart: unless-stopped
    ports:
      - "4003:4003"
    environment:
      SERVICE_NAME: paths-service
      PORT: 4003
      DATABASE_URL: ${DATABASE_URL:-mongodb://host.docker.internal:27017/fmp68?replicaSet=rs0&directConnection=true}
      USERS_SERVICE_URL: http://users-service:4002
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      users-service:
        condition: service_healthy
    networks:
      - fmp-net

  # ─── TRACKING SERVICE (WebSocket) ─────────────────────────────
  tracking-service:
    build:
      context: ./tracking-service
      dockerfile: Dockerfile
    image: fmp-tracking-service:local
    container_name: fmp-tracking-service
    restart: unless-stopped
    ports:
      - "4004:4004"
    environment:
      SERVICE_NAME: tracking-service
      PORT: 4004
      FRONTEND_URL: http://localhost:3000
      DATABASE_URL: ${DATABASE_URL:-mongodb://host.docker.internal:27017/fmp68?replicaSet=rs0&directConnection=true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - fmp-net

  # ─── NOTIFICATION SERVICE ─────────────────────────────────────
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    image: fmp-notification-service:local
    container_name: fmp-notification-service
    restart: unless-stopped
    ports:
      - "4005:4005"
    environment:
      SERVICE_NAME: notification-service
      PORT: 4005
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - fmp-net

  # ─── INFRASTRUCTURE: RabbitMQ ─────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: fmp-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fmp-net

  # ─── INFRASTRUCTURE: Redis ────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: fmp-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - fmp-net

networks:
  fmp-net:
    driver: bridge
    name: fmp-net
