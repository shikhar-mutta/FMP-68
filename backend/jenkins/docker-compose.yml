# ─────────────────────────────────────────────────────────────
# Run Jenkins for FMP-68 CI/CD
#   docker compose -f backend/jenkins/docker-compose.yml up -d --build
# UI:           http://localhost:8080
# Agent port:   50000
#
# Mounts:
#   /var/run/docker.sock         → build images using the host daemon
#   ~/.kube/config               → kubectl + minikube CLI talk to host cluster
#   ~/.minikube                  → certs referenced by kubeconfig
#   jenkins_home (named volume)  → persistent Jenkins state
#
# Networks:
#   default — standard compose bridge
#   minikube — joined as a secondary network so kubectl can reach
#              the Minikube API server at 192.168.49.2:8443
# ─────────────────────────────────────────────────────────────
services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DOCKER_GID: "124"
    image: fmp-jenkins:local
    container_name: fmp-jenkins
    restart: unless-stopped
    user: jenkins
    ports:
      - "8080:8080"
      - "50000:50000"
    environment:
      JENKINS_OPTS: "--prefix=/"
      KUBECONFIG: "/var/jenkins_home/kubeconfig"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/.kube/config:/var/jenkins_home/.kube/config:ro
      - ${HOME}/.minikube:/var/jenkins_home/.minikube:ro
    networks:
      - default
      - minikube

volumes:
  jenkins_home: {}

networks:
  minikube:
    external: true
