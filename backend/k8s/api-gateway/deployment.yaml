apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: fmp
  labels: { app: api-gateway }
spec:
  # 2 replicas so a rolling update has another pod to serve traffic
  # while the first is being replaced — gives a meaningful zero-downtime demo.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
    spec:
      # Give shutdowns enough time for in-flight requests + WebSocket
      # connections to drain after SIGTERM.
      terminationGracePeriodSeconds: 30
      containers:
        - name: api-gateway
          image: shikhar68/fmp-api-gateway:latest
          imagePullPolicy: IfNotPresent            # use the locally-loaded minikube image
          ports:
            - { name: http, containerPort: 4000 }
          env:
            - { name: SERVICE_NAME, value: api-gateway }
            - { name: PORT,         value: "4000" }
          envFrom:
            - configMapRef: { name: fmp-config }
            - secretRef:    { name: fmp-secret }
          resources:
            requests: { cpu: "100m", memory: "192Mi" }
            limits:   { cpu: "500m", memory: "384Mi" }
          # preStop sleep gives kube-proxy time to remove this pod from
          # the Service's endpoint list BEFORE the container gets SIGTERM.
          # Without this, new requests can still hit a pod that just
          # started shutting down → connection resets.
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          livenessProbe:
            httpGet: { path: /health, port: 4000 }
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /health, port: 4000 }
            initialDelaySeconds: 3
            periodSeconds: 5
