apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: fmp
  labels: { app: auth-service }
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: auth-service }
  template:
    metadata:
      labels: { app: auth-service }
    spec:
      containers:
        - name: auth-service
          image: fmp-auth-service:local
          imagePullPolicy: Never
          ports:
            - { name: http, containerPort: 4001 }
          env:
            - { name: SERVICE_NAME, value: auth-service }
            - { name: PORT,         value: "4001" }
          envFrom:
            - configMapRef: { name: fmp-config }
            - secretRef:    { name: fmp-secret }
          resources:
            requests: { cpu: "100m", memory: "192Mi" }
            limits:   { cpu: "400m", memory: "384Mi" }
          livenessProbe:
            httpGet: { path: /health, port: 4001 }
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /health, port: 4001 }
            initialDelaySeconds: 3
            periodSeconds: 5
