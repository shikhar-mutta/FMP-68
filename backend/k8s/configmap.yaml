apiVersion: v1
kind: ConfigMap
metadata:
  name: fmp-config
  namespace: fmp
data:
  # Frontend origin — used for CORS + OAuth post-login redirect
  FRONTEND_URL: "http://localhost:3000"
  # Inter-service URLs (resolved by Kubernetes Service DNS)
  AUTH_SERVICE_URL: "http://auth-service:4001"
  USERS_SERVICE_URL: "http://users-service:4002"
  PATHS_SERVICE_URL: "http://paths-service:4003"
  TRACKING_SERVICE_URL: "http://tracking-service:4004"
  NOTIFICATION_SERVICE_URL: "http://notification-service:4005"
  # MongoDB on host, reached via the ExternalName mongo-external service
  DATABASE_URL: "mongodb://mongo-external:27017/fmp68?replicaSet=rs0&directConnection=true"
  # RabbitMQ (in-cluster)
  RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672"
  # OAuth public values
  GOOGLE_CLIENT_ID: "430506095007-u8g4b06sed14stgkrlk11oqvfqrmshk4.apps.googleusercontent.com"
  GOOGLE_CALLBACK_URL: "http://localhost:4000/auth/google/callback"
  JWT_EXPIRES_IN: "7d"
