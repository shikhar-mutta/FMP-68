apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  namespace: elk
  labels: { app: elasticsearch }
spec:
  replicas: 1
  selector:
    matchLabels: { app: elasticsearch }
  template:
    metadata:
      labels: { app: elasticsearch }
    spec:
      # Elasticsearch refuses to start if vm.max_map_count is too low.
      # On Minikube we can't easily sysctl the host, so set it via initContainer.
      initContainers:
        - name: sysctl
          image: busybox:1.36
          command: ["sh", "-c", "sysctl -w vm.max_map_count=262144 || true"]
          securityContext: { privileged: true }
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
          ports:
            - { name: http,      containerPort: 9200 }
            - { name: transport, containerPort: 9300 }
          env:
            - { name: discovery.type,            value: "single-node" }
            - { name: xpack.security.enabled,    value: "false" }
            - { name: ES_JAVA_OPTS,              value: "-Xms512m -Xmx512m" }
            - { name: cluster.name,              value: "fmp-elk" }
          resources:
            requests: { cpu: "200m", memory: "1Gi" }
            limits:   { cpu: "1",    memory: "1.5Gi" }
          readinessProbe:
            httpGet:
              path: "/_cluster/health?local=true"
              port: 9200
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - { name: data, mountPath: /usr/share/elasticsearch/data }
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: elk
spec:
  selector: { app: elasticsearch }
  ports:
    - { name: http,      port: 9200, targetPort: 9200 }
    - { name: transport, port: 9300, targetPort: 9300 }
