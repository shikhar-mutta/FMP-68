---
apiVersion: batch/v1
kind: Job
metadata:
  name: kibana-import-dashboard
  namespace: elk
  labels:
    app.kubernetes.io/part-of: fmp-68
    app.kubernetes.io/component: kibana-init
spec:
  # Re-run safely after each `kubectl apply` (delete + recreate)
  backoffLimit: 5
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels: { app: kibana-import }
    spec:
      restartPolicy: OnFailure
      containers:
        - name: importer
          image: curlimages/curl:8.7.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              echo "[kibana-import] Waiting for Kibana to be ready..."
              # Kibana /api/status returns 200 only when ALL plugins are green.
              # Poll for up to 5 minutes.
              for i in $(seq 1 60); do
                if curl -fsS "http://kibana:5601/api/status" \
                     -H "kbn-xsrf: true" >/dev/null 2>&1; then
                  echo "[kibana-import] Kibana ready (try $i)."
                  break
                fi
                echo "[kibana-import] not ready yet (try $i/60)... sleeping 5s"
                sleep 5
              done

              echo "[kibana-import] Posting saved objects (overwrite=true)..."
              # Returns JSON {success: bool, successCount: N, ...}
              curl -fsSL "http://kibana:5601/api/saved_objects/_import?overwrite=true" \
                -H "kbn-xsrf: true" \
                -F file=@/objects/fmp-objects.ndjson
              echo ""
              echo "[kibana-import] ✅ Dashboard 'FMP-68 — Application Logs' imported."
          volumeMounts:
            - { name: objects, mountPath: /objects, readOnly: true }
      volumes:
        - name: objects
          configMap:
            name: kibana-saved-objects
            items:
              - { key: fmp-objects.ndjson, path: fmp-objects.ndjson }
