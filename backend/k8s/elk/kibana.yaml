apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: elk
  labels: { app: kibana }
spec:
  replicas: 1
  selector:
    matchLabels: { app: kibana }
  template:
    metadata:
      labels: { app: kibana }
    spec:
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:8.13.0
          ports:
            - { name: http, containerPort: 5601 }
          env:
            - { name: ELASTICSEARCH_HOSTS, value: "http://elasticsearch:9200" }
            - { name: SERVER_HOST,         value: "0.0.0.0" }
            - { name: SERVER_NAME,         value: "kibana.fmp.local" }
          resources:
            requests: { cpu: "150m", memory: "512Mi" }
            limits:   { cpu: "1",    memory: "1Gi" }
          readinessProbe:
            httpGet: { path: /api/status, port: 5601 }
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
---
apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: elk
spec:
  selector: { app: kibana }
  ports:
    - { name: http, port: 5601, targetPort: 5601 }
---
# Ingress: browse Kibana at http://kibana.fmp.local
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kibana-ingress
  namespace: elk
spec:
  ingressClassName: nginx
  rules:
    - host: kibana.fmp.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kibana
                port:
                  number: 5601
