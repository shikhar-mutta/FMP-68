apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-config
  namespace: elk
data:
  logstash.yml: |
    http.host: "0.0.0.0"
    path.config: /usr/share/logstash/pipeline
    xpack.monitoring.enabled: false
  logstash.conf: |
    input {
      beats {
        port => 5044
      }
    }
    filter {
      # Try to parse JSON messages (NestJS pino emits JSON when configured)
      if [message] =~ /^\s*\{/ {
        json {
          source => "message"
          skip_on_invalid_json => true
        }
      }
      # Promote the Kubernetes container name to a top-level "service" field
      if [kubernetes][container][name] {
        mutate {
          add_field => { "service" => "%{[kubernetes][container][name]}" }
        }
      }
    }
    output {
      elasticsearch {
        hosts              => ["http://elasticsearch:9200"]
        # ILM mode: write to the rollover alias 'fmp-logs', backed by
        # fmp-logs-000001, fmp-logs-000002, ... ES rolls them per the
        # 'fmp-logs-policy' (7d / 1GB hot → delete at 30d). The Kibana
        # index pattern 'fmp-logs-*' still matches every backing index.
        ilm_enabled        => true
        ilm_rollover_alias => "fmp-logs"
        ilm_pattern        => "000001"
        ilm_policy         => "fmp-logs-policy"
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logstash
  namespace: elk
  labels: { app: logstash }
spec:
  replicas: 1
  selector:
    matchLabels: { app: logstash }
  template:
    metadata:
      labels: { app: logstash }
    spec:
      containers:
        - name: logstash
          image: docker.elastic.co/logstash/logstash:8.13.0
          ports:
            - { name: beats, containerPort: 5044 }
          env:
            - { name: LS_JAVA_OPTS, value: "-Xms256m -Xmx256m" }
          resources:
            requests: { cpu: "150m", memory: "384Mi" }
            limits:   { cpu: "800m", memory: "768Mi" }
          volumeMounts:
            - { name: cfg,      mountPath: /usr/share/logstash/config/logstash.yml, subPath: logstash.yml }
            - { name: pipeline, mountPath: /usr/share/logstash/pipeline/logstash.conf, subPath: logstash.conf }
      volumes:
        - name: cfg
          configMap:
            name: logstash-config
            items:
              - { key: logstash.yml, path: logstash.yml }
        - name: pipeline
          configMap:
            name: logstash-config
            items:
              - { key: logstash.conf, path: logstash.conf }
---
apiVersion: v1
kind: Service
metadata:
  name: logstash
  namespace: elk
spec:
  selector: { app: logstash }
  ports:
    - { name: beats, port: 5044, targetPort: 5044 }
