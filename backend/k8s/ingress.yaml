# Ingress for backend API paths on fmp.local. Each API prefix routes
# to api-gateway, which then proxies to the downstream microservices.
# The frontend Ingress (frontend/k8s/ingress.yaml) adds the '/'
# catch-all rule — nginx-ingress merges both and routes by
# longest-prefix-wins, so requests like /auth/me hit api-gateway
# while /, /static/* etc. hit the frontend nginx pod.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fmp-ingress
  namespace: fmp
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: fmp.local
      http:
        paths:
          - path: /auth
            pathType: Prefix
            backend:
              service: { name: api-gateway, port: { number: 4000 } }
          - path: /users
            pathType: Prefix
            backend:
              service: { name: api-gateway, port: { number: 4000 } }
          - path: /paths
            pathType: Prefix
            backend:
              service: { name: api-gateway, port: { number: 4000 } }
          - path: /follow-requests
            pathType: Prefix
            backend:
              service: { name: api-gateway, port: { number: 4000 } }
          - path: /socket.io
            pathType: Prefix
            backend:
              service: { name: api-gateway, port: { number: 4000 } }
