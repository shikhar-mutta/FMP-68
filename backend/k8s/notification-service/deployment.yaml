apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: fmp
  labels: { app: notification-service }
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: notification-service }
  template:
    metadata:
      labels: { app: notification-service }
    spec:
      containers:
        - name: notification-service
          image: shikhar68/fmp-notification-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 4005 }
          env:
            - { name: SERVICE_NAME, value: notification-service }
            - { name: PORT,         value: "4005" }
          envFrom:
            - configMapRef: { name: fmp-config }
            - secretRef:    { name: fmp-secret }
          resources:
            requests: { cpu: "50m",  memory: "128Mi" }
            limits:   { cpu: "300m", memory: "256Mi" }
          livenessProbe:
            httpGet: { path: /health, port: 4005 }
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /health, port: 4005 }
            initialDelaySeconds: 3
            periodSeconds: 5
