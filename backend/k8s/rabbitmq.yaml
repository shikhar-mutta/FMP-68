apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: fmp
  labels: { app: rabbitmq }
spec:
  replicas: 1
  selector:
    matchLabels: { app: rabbitmq }
  template:
    metadata:
      labels: { app: rabbitmq }
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management-alpine
          ports:
            - { name: amqp,    containerPort: 5672 }
            - { name: mgmt,    containerPort: 15672 }
          env:
            - { name: RABBITMQ_DEFAULT_USER, value: "guest" }
            - { name: RABBITMQ_DEFAULT_PASS, value: "guest" }
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "400m", memory: "512Mi" }
          # TCP probe is cheap and reliable on Alpine; rabbitmq-diagnostics
          # has Erlang-cookie races on first boot in containers.
          readinessProbe:
            tcpSocket:
              port: 5672
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: fmp
spec:
  selector: { app: rabbitmq }
  ports:
    - { name: amqp, port: 5672,  targetPort: 5672 }
    - { name: mgmt, port: 15672, targetPort: 15672 }
