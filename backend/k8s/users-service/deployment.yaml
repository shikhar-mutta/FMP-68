apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-service
  namespace: fmp
  labels: { app: users-service }
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: users-service }
  template:
    metadata:
      labels: { app: users-service }
    spec:
      containers:
        - name: users-service
          image: shikhar68/fmp-users-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 4002 }
          env:
            - { name: SERVICE_NAME, value: users-service }
            - { name: PORT,         value: "4002" }
          envFrom:
            - configMapRef: { name: fmp-config }
            - secretRef:    { name: fmp-secret }
          resources:
            requests: { cpu: "150m", memory: "256Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
          livenessProbe:
            httpGet: { path: /health, port: 4002 }
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /health, port: 4002 }
            initialDelaySeconds: 5
            periodSeconds: 5
