# ─────────────────────────────────────────────────────────────
# fmp-frontend nginx server block
#
# This container only serves the React SPA. Backend routing (/auth,
# /users, /paths, /follow-requests, /socket.io) is handled by the
# cluster Ingress, NOT by this nginx — so no proxy_pass blocks here.
# ─────────────────────────────────────────────────────────────
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Compressed text assets save ~70% on first paint
  gzip            on;
  gzip_types      text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 512;

  # SPA fallback — every unknown URL renders index.html so
  # react-router-dom can take over client-side.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed bundle assets (CRA outputs hashed file names under /static/)
  # are safe to cache forever; the HTML referencing them is revalidated.
  location /static/ {
    expires      1y;
    add_header   Cache-Control "public, immutable";
    try_files    $uri =404;
  }

  # Security niceties
  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options        SAMEORIGIN;
  add_header Referrer-Policy        strict-origin-when-cross-origin;
}
