# ─────────────────────────────────────────────────────────────────────
# fmp-frontend nginx server block — ONLINE MODE (single-origin tunnel)
#
# In local dev, the browser talks directly to localhost:4000 for the
# API. In online mode the React bundle uses relative URLs, so this
# nginx must reverse-proxy backend routes to the api-gateway container
# on the shared fmp-net network. That way the whole app is reachable
# through a single ngrok tunnel.
# ─────────────────────────────────────────────────────────────────────
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 10m;

  # Compressed text assets
  gzip            on;
  gzip_types      text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 512;

  # ── Backend REST routes ─────────────────────────────────────────
  # /auth, /users, /paths, /follow-requests → api-gateway:4000
  location ~ ^/(auth|users|paths|follow-requests|notifications)(/|$) {
    proxy_pass         http://api-gateway:4000;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto https;
    proxy_read_timeout 60s;
  }

  # ── WebSocket: socket.io tracking namespace ─────────────────────
  location /socket.io/ {
    proxy_pass         http://api-gateway:4000;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto https;
    proxy_read_timeout 86400s;
  }

  # ── Hashed CRA bundle assets ────────────────────────────────────
  location /static/ {
    expires      1y;
    add_header   Cache-Control "public, immutable";
    try_files    $uri =404;
  }

  # ── SPA fallback (MUST be last) ─────────────────────────────────
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Security niceties
  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options        SAMEORIGIN;
  add_header Referrer-Policy        strict-origin-when-cross-origin;
}
