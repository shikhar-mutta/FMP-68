apiVersion: apps/v1
kind: Deployment

metadata:
  name: auth-service
  namespace: fmp

spec:
  replicas: 1

  strategy:
    type: RollingUpdate

    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  selector:
    matchLabels:
      app: auth-service

  template:
    metadata:
      labels:
        app: auth-service

    spec:
      containers:
        - name: auth-service
          image: auth-service:latest
          imagePullPolicy: Never
          
          envFrom:
          - secretRef:
              name: auth-secret

          - configMapRef:
              name: auth-config
          ports:
            - name: http
              containerPort: 3001

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"

            limits:
              cpu: "100m"
              memory: "128Mi"

          env:
            - name: DATABASE_URL
              value: "mongodb://admin:password@mongodb:27017/fmp?authSource=admin"

