apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: fmp

spec:
  replicas: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: frontend:latest
          imagePullPolicy: Never
          envFrom:
          - secretRef:
              name: secret

          - configMapRef:
              name: config
          ports:
            - containerPort: 80