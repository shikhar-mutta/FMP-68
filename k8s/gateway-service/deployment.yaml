apiVersion: apps/v1
kind: Deployment

metadata:
  name: gateway-service
  namespace: fmp

spec:
  replicas: 1

  strategy:
    type: RollingUpdate

    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  selector:
    matchLabels:
      app: gateway-service

  template:
    metadata:
      labels:
        app: gateway-service

    spec:
      containers:
        - name: gateway-service
          image: gateway-service:latest
          imagePullPolicy: Never

          ports:
            - name: http
              containerPort: 3000

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"

            limits:
              cpu: "100m"
              memory: "128Mi"

          env:
            - name: AUTH_SERVICE_URL
              value: "http://auth-service:3001"

            - name: FOLLOW_REQUEST_SERVICE_URL
              value: "http://follow-request-service:3003"
