apiVersion: apps/v1
kind: Deployment

metadata:
  name: mongodb
  namespace: fmp

spec:
  replicas: 1

  selector:
    matchLabels:
      app: mongodb

  template:
    metadata:
      labels:
        app: mongodb

    spec:
      containers:
        - name: mongodb
          image: mongo:7

          envFrom:
            - secretRef:
                name: secret
          ports:
            - containerPort: 27017

          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: admin

            - name: MONGO_INITDB_ROOT_PASSWORD
              value: password

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "250m"
              memory: "256Mi"