apiVersion: apps/v1
kind: Deployment

metadata:
  name: tracking-service
  namespace: fmp

spec:
  replicas: 1

  selector:
    matchLabels:
      app: tracking-service

  template:
    metadata:
      labels:
        app: tracking-service

    spec:
      containers:
        - name: tracking-service
          image: tracking-service:latest
          imagePullPolicy: Never

          env:
            - name: RABBITMQ_URL
              value: amqp://rabbitmq:5672